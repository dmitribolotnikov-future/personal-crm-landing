# Push to main → build dist/ → rsync --delete to the server → the home page must answer 200 with the new build
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time: a newer push waits for the running deploy instead of cancelling it
concurrency:
  group: deploy-landing
  cancel-in-progress: false

env:
  SITE_URL: https://lichnocrm.ru/

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Set up SSH to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      # The key is locked on the server to rsync into /var/www/lichnocrm.ru (rrsync), so "/" is that folder.
      # New files are swapped in at the end and old ones deleted after, so visitors never get a half-copied page.
      - name: Upload dist/ to the server
        run: >-
          rsync --recursive --links --times --perms --chmod=D755,F644
          --delete --delete-delay --delay-updates --itemize-changes
          dist/ server:/

      - name: Check the home page
        run: |
          status=$(curl --silent --show-error --output home.html --write-out '%{http_code}' "$SITE_URL")
          echo "$SITE_URL → HTTP $status"
          test "$status" = 200
          # The server must give back exactly the page we just built
          cmp home.html dist/index.html
          echo "The home page is the new build"
